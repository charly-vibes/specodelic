id = "a-stale-model-report-is-refused"
description = "When `<stem>.check.json` is missing, stale, unparseable, or fails the scope check, the run exits 2 with a hint naming the model-check command — the stored report is never rewritten and no verdict is inferred (check / Non-judgement outcomes produce no row)."
# Provenance (specodelic-sqgv, 2026-11-18): authored at the companion archive
# of add-check-judge-verb — the matrix case pins the missing-report arm; the
# scenario pin re-compiles an edited revision against the stored report and
# then corrupts it, asserting exit 2, zero records, the model-check hint, and
# byte-identical stored report on both branches.
archetype = "PF"
status = "active"
superseded_by = ""
authored_with = "0.12.3"

