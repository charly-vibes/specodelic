id = "existing-verbs-keep-their-contracts"
description = "When the change lands, `verify`, `conform`, and `audit` keep their status strings, report schemas, and exit codes unchanged (check / Scope boundary)."
# Provenance (specodelic-sqgv, 2026-11-18): authored at the companion archive
# of add-check-judge-verb — every entry is a landed contract of a composed
# verb, unmodified by `check`: conform's report schema and its exit 1/exit 2
# arms, verify's status strings (library and CLI labels), and audit's schema,
# evidence-scope statement and exit 1. Non-regression archetype: these tests
# existed before this capability and must keep passing.
