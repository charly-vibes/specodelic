source = "model_check"

[[constraints]]
id = "checker_invoked"
kind = "invariant"
expr = "`reaching model_checked always corresponds to an actual checker run, by the selected backend, against the current compiled model — model_present's structural check is not itself that run`"
traces_to = "[[model_check]]"

[[constraints]]
id = "exhaustive_within_bound"
kind = "invariant"
expr = "`a run explores all reachable states up to a stated bound (state-space size or step count) before it may report no counterexample; the bound is part of the report, since unbounded checking of a spec with no finite state space never terminates`"
traces_to = "[[model_check]]"

[[constraints]]
id = "counterexample_is_minimal"
kind = "invariant"
expr = "`when a run finds a counterexample, it reports the shortest violating transition sequence found, not merely the first one encountered`"
traces_to = "[[model_check]]"

[[constraints]]
id = "counterexample_names_violated_invariant"
kind = "invariant"
expr = "`a counterexample report names exactly one violated invariant, by its Constraints-table id, together with the full state trace leading to it`"
traces_to = "[[model_check]]"

[[constraints]]
id = "backend_identified"
kind = "invariant"
expr = "`a run report names the backend engine and version that produced it, so two backends' reports on the same compiled model and bound are attributable and comparable`"
traces_to = "[[model_check]]"

[[constraints]]
id = "no_counterexample_feeds_verify"
kind = "invariant"
expr = "`[[specodelic.no_counterexample]] holds iff the most recent run on the current compiled module reported clean within its stated bound`"
traces_to = "[[model_check]]"

[[constraints]]
id = "rerun_on_model_change"
kind = "invariant"
expr = "`a run's clean result does not satisfy [[specodelic.no_counterexample]] once the Model section (States or Transitions) or any executable invariant fragment has changed since that run — the model must be re-run, not assumed still clean (the fragment extension is specodelic.md Revision 15; the compiled module carries the fragment manifest, so the artifact hash covers it)`"
traces_to = "[[model_check]]"

[[constraints]]
id = "executable_invariants_execute"
kind = "invariant"
expr = "`the native backend executes every executable invariant fragment (the **rust:** marker in a kind == invariant Constraint's expr — specodelic.md Revision 15) as an invariant over the compiled model: each evaluated at every reachable state, each named by its Constraints-table id in the report's invariants_checked. Fragments are Rust, compiled verbatim — executed by a scratch-crate run, since the interpreter backend cannot evaluate user Rust in-process; a backend that cannot execute fragments reports exploration_only, never a fabricated clean`"
traces_to = "[[model_check]]"

[[constraints]]
id = "invariant_totality"
kind = "invariant"
expr = "`an executable invariant fragment evaluation that panics reports the invariant violated at the state where the panic occurred — a panicking predicate is never a pass and never silently skipped`"
traces_to = "[[model_check]]"

[[constraints]]
id = "required_claims_classified"
kind = "invariant"
expr = "`a run partitions each parsed file's invariant-kind Constraints into a required set — those opted into executable (rust: fragment), kernel, or citation evaluation — and an unchecked set of prose-only invariants: prose wording, a constraint's name, or merely having a deriving Property never implies evaluation, and advisory/effect/extension-point rows are never required`"
traces_to = "[[model_check]]"

[[constraints]]
id = "claim_aggregate_governs"
kind = "invariant"
expr = "`the run outcome is governed by the required claims' statuses with fixed priority: any refuted required claim yields counterexample_found naming it; absent refutation, an exhausted time/state/depth budget yields timed_out; otherwise any unknown, unsupported, or missing required claim yields exploration_only with reasons — and so does an empty required set; a nonempty required set all verified over a completed bounded exploration is the only clean`"
traces_to = "[[model_check]]"

[[constraints]]
id = "claim_report_schema"
kind = "invariant"
expr = "`the run's persisted report declares claim_schema_version 1, canonical qualified claim records (id, evaluator kind, status, reason where not verified), expected_claim_ids, unchecked_claim_ids, and a scope_sha256 digest of the parsed structured content and the consumed compiled artifacts — the digest binds structured content, not filesystem paths: reordering CLI paths or editing prose alone preserves it, while two inputs differing in invariant content never share one`"
traces_to = "[[model_check]]"

[[constraints]]
id = "corpus_identity_scope"
kind = "invariant"
expr = "`a model-check, verify, or orchestrate invocation refuses, before compilation, evaluation, or report writes, any input set in which two parsed files claim the same intent id — labeled duplicate_corpus_identity with a rename hint (Revision 18: the former isolated-scope rule retired with `id: spec` itself; dual-format files carry real intent ids and compose like any corpus, so identity uniqueness is the only scope law left)`"
traces_to = "[[model_check]]"
