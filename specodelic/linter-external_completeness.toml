source = "linter.external_completeness"

[[constraints]]
id = "checklist_well_formed"
kind = "invariant"
expr = "`a declared checklist is a flat list of items, each with a stable id and a plain-text description`"
traces_to = "[[linter.external_completeness]]"

[[constraints]]
id = "every_item_accounted"
kind = "invariant"
expr = "`∀ checklist item c: ∃ exactly one mapping row m with m.item == c.id and m.status ∈ {covered, waived}`"
traces_to = "[[linter.external_completeness]]"

[[constraints]]
id = "covered_maps_resolve"
kind = "invariant"
expr = '`∀ mapping row m where m.status == "covered": m.mapped_ids is non-empty, and every id in it resolves to a real constraint or property row`'
traces_to = "[[linter.external_completeness]]"

[[constraints]]
id = "waiver_has_rationale"
kind = "invariant"
expr = '`∀ mapping row m where m.status == "waived": m.rationale is non-empty prose`'
traces_to = "[[linter.external_completeness]]"

[[constraints]]
id = "no_duplicate_claim"
kind = "invariant"
expr = "`∀ checklist item c: no two mapping rows both target c.id`"
traces_to = "[[linter.external_completeness]]"

[[constraints]]
id = "manifest_failure"
kind = "effect"
expr = "`linter.external_completeness.manifest_failure(detail)`"
traces_to = "[[linter.external_completeness]]"

[[constraints]]
id = "mapping_failure"
kind = "effect"
expr = "`linter.external_completeness.mapping_failure(detail)`"
traces_to = "[[linter.external_completeness]]"

[[constraints]]
id = "resolution_failure"
kind = "effect"
expr = "`linter.external_completeness.resolution_failure(detail)`"
traces_to = "[[linter.external_completeness]]"
