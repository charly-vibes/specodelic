source = "verify"

[[constraints]]
id = "blocks_run_to_completion"
kind = "invariant"
expr = "`verify actually executes every proptest! block compile.md produced against the current compiled artifact — properties_pass is never satisfied by a partial run or a cached prior result`"
traces_to = "[[verify]]"

[[constraints]]
id = "properties_pass_reflects_latest_run"
kind = "invariant"
expr = "`[[specodelic.properties_pass]] holds iff every block from the most recent run against the current compiled artifact passed; a run predating the last edit to Properties, Constraints, or Model does not count`"
traces_to = "[[verify]]"

[[constraints]]
id = "failure_reports_shrunk_counterexample"
kind = "invariant"
expr = "`when a proptest! block fails, the report gives the shrunk (minimal) failing input, not the first randomly-generated failing input encountered`"
traces_to = "[[verify]]"

[[constraints]]
id = "both_gates_required"
kind = "invariant"
expr = "`verify only transitions a file to verified when both [[specodelic.no_counterexample]] (model_check.md's clean outcome) and [[specodelic.properties_pass]] hold — passing properties alone, or a clean model alone, is insufficient`"
traces_to = "[[verify]]"

[[constraints]]
id = "law_cases_unexecuted"
kind = "invariant"
expr = "`for a law-kind property compiled into multiple blocks (one per required case), all compiled blocks must pass — a partial pass (identity passes, associativity fails) is a failure of the property, not a partial success`"
traces_to = "[[verify]]"

[[constraints]]
id = "verify_is_idempotent"
kind = "invariant"
expr = "`re-running verify against an unchanged compiled artifact yields the same pass/fail outcome as the prior run, even though proptest may resample inputs each run for coverage`"
traces_to = "[[verify]]"

[[constraints]]
id = "bounded_wall_clock"
kind = "invariant"
expr = "`the verify runner bounds its cargo test run on a wall-clock clock (default 600s, `--timeout-secs 0` disables the bound); a run exceeding the bound is killed and reported as a labeled timeout — never a silent hang, and never indistinguishable from a block failure`"
traces_to = "[[verify]]"

[[constraints]]
id = "verification_failure"
kind = "effect"
expr = "`verify.verification_failure(detail)`"
traces_to = "[[verify]]"

[[constraints]]
id = "required_claims_govern_acceptance"
kind = "invariant"
expr = "`verify only transitions a file to verified when every required claim (model_check.md's required_claims_classified set) is verified in the current report AND every generated property block passes — a passing property run alone never covers an unknown, missing, or refuted claim; invalid or duplicate claim records are rejected as malformed evidence, never inferred as unknown success, and prose-only invariants stay unchecked`"
traces_to = "[[verify]]"

[[constraints]]
id = "evidence_scope_bound"
kind = "invariant"
expr = "`verify recomputes the scope digest and the required claim set from the current inputs and compares them against the stored report: old or unrecognized claim-schema versions, absent scope fingerprints, omitted or duplicate records, changed contributing inputs, or artifact mismatch fail with a rerun hint naming the model-check command — a stored report is never rewritten to manufacture evidence, and the digest binds structured content, not filesystem paths, so swapped reports from different scopes never verify`"
traces_to = "[[verify]]"

[[constraints]]
id = "assurance_views_agree"
kind = "invariant"
expr = "`CLI JSON, human output, and the persisted report agree on evaluated, unchecked, and blocking claims — no view reports verified while another names a blocker — and release documentation distinguishes structural lint, bounded model exploration, verified declared claims, and external application-test binding without advertising pending capabilities as implemented`"
traces_to = "[[verify]]"
