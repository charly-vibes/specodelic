source = "compile"

[[constraints]]
id = "precondition_satisfied"
kind = "invariant"
expr = "`Compile only runs on a file that has passed both lint and coverage` — restates [[specodelic.compile]]'s own guard (transition, not row)"
traces_to = "[[compile]]"

[[constraints]]
id = "constraint_table_to_toml"
kind = "invariant"
expr = "`every Constraint row compiles to one TOML table entry {id, kind, expr, traces_to}, field-for-field, with no lossy transformation`"
traces_to = "[[compile]]"

[[constraints]]
id = "model_to_tla"
kind = "invariant"
expr = "`the Model section compiles to one TLA+ module — always emitted, regardless of which model_check backend (native stateright or TLC) later runs against the model: the module opens with a single-line TLA+ module header (dashes + MODULE name + dashes — the only form an engine parses); each State becomes a value in the module's state variable's range, each Transition becomes one disjunct of the Next action guarded by its guard field, and one closing stuttering disjunct (`UNCHANGED vpc`) ends Next — guards travel as prose comments, so a terminal state must not read as an engine-side deadlock; a State with an `emits` field additionally becomes one entry in an `Output` function from that state value to the effect-kind Constraint's `expr` — absent for a state with no `emits`, never a default/null entry`"
traces_to = "[[compile]]"

[[constraints]]
id = "properties_to_proptest"
kind = "invariant"
expr = "`each Property row compiles to one proptest! block: generator becomes the block's input strategy, predicate becomes its assertion body — verbatim as a **rust:** fragment when the row opts in ([[compile.predicate_fragment_opt_in]]), else the un-translated todo_predicate! placeholder that compiles here and fails only at execution; a law-kind property compiles to one block per case enumerated in its predicate's **name:** case labels (the identity and associativity floor is lint-enforced ahead of compile, specodelic.md Revision 13)`"
traces_to = "[[compile]]"

[[constraints]]
id = "predicate_fragment_opt_in"
kind = "invariant"
expr = "`a Property's predicate cell may opt into executable translation with exactly one **rust:** marker and a non-empty fragment after it — the fragment is a Rust boolean expression emitted verbatim as the block's assertion body, binding the block's generated values (v0…, one per generator named in the generator cell, each a String); a cell with no marker compiles exactly as before (the placeholder) — pure widening, nothing valid before this Revision is invalidated`"
traces_to = "[[compile]]"

[[constraints]]
id = "invariant_fragment_opt_in"
kind = "invariant"
expr = "`a Constraint's expr cell may carry the same **rust:** fragment when the row's kind is invariant — the fragment becomes an executable invariant model_check's native backend executes (model_check.md Revision 15); a fragment on a Constraint of any other kind (effect, advisory, a pack fiber kind) is a labeled extraction failure, never a silently ignored marker`"
traces_to = "[[compile]]"

[[constraints]]
id = "fragment_law_rejected"
kind = "invariant"
expr = "`a law-kind Property row's predicate cell must not carry a **rust:** fragment — each required case needs its own assertion body and one fragment cannot honestly serve several named cases; violation is a labeled extraction failure`"
traces_to = "[[compile]]"

[[constraints]]
id = "fragment_guard_rejected"
kind = "invariant"
expr = "`a Transition's guard cell must not carry a **rust:** fragment in this Revision — the program-counter model has no data binding a guard could constrain, so executable guards have no defined semantics; violation is a labeled extraction failure, never a silently ignored marker (decision of record: deferred to a future Revision alongside a data-carrying state space)`"
traces_to = "[[compile]]"

[[constraints]]
id = "fragment_hygiene"
kind = "invariant"
expr = "`a fragment's text must not contain unsafe, extern, include!, include_str!, include_bytes!, std::fs, std::process, std::net, std::env, asm!, or Command — defense-in-depth against a fragment escaping its artifact's role (fragments run on the invoking user's machine with the invoking user's privileges, exactly like every other compiled artifact; the Rust compiler is not a sandbox); violation is a labeled extraction failure naming the token`"
traces_to = "[[compile]]"

[[constraints]]
id = "compile_is_total"
kind = "invariant"
expr = "`∀ file that has passed lint and coverage: Compile either produces all three artifacts or reports, for exactly one of them, which stage failed and why — it never returns a silent partial result`"
traces_to = "[[compile]]"

[[constraints]]
id = "compile_preserves_ids"
kind = "invariant"
expr = "`every id present in the source file appears, unchanged, in at least one compiled artifact — no id is silently dropped in translation`"
traces_to = "[[compile]]"

[[constraints]]
id = "no_semantic_drift"
kind = "invariant"
expr = "`re-parsing a compiled artifact and re-emitting it yields output identical to the original compile — Compile is idempotent under its own round trip`"
traces_to = "[[compile]]"

[[constraints]]
id = "extraction_failure"
kind = "effect"
expr = "`compile.extraction_failure(row_id, reason) — the extraction stage failed on row row_id because reason`"
traces_to = "[[compile]]"

[[constraints]]
id = "emission_failure"
kind = "effect"
expr = "`compile.emission_failure(detail) — the emission stage failed because detail`"
traces_to = "[[compile]]"
