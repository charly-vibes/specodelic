source = "compile"

[[constraints]]
id = "precondition_satisfied"
kind = "invariant"
expr = "`Compile only runs on a file that has passed both lint and coverage` — restates [[specodelic.compile]]'s own guard (transition, not row)"
traces_to = "[[compile]]"

[[constraints]]
id = "constraint_table_to_toml"
kind = "invariant"
expr = "`every Constraint row compiles to one TOML table entry {id, kind, expr, traces_to}, field-for-field, with no lossy transformation`"
traces_to = "[[compile]]"

[[constraints]]
id = "model_to_tla"
kind = "invariant"
expr = "`the Model section compiles to one TLA+ module — always emitted, regardless of which model_check backend (native stateright or TLC) later runs against the model: the module opens with a single-line TLA+ module header (dashes + MODULE name + dashes — the only form an engine parses); each State becomes a value in the module's state variable's range, each Transition becomes one disjunct of the Next action guarded by its guard field, and one closing stuttering disjunct (`UNCHANGED vpc`) ends Next — guards travel as prose comments, so a terminal state must not read as an engine-side deadlock; a State with an `emits` field additionally becomes one entry in an `Output` function from that state value to the effect-kind Constraint's `expr` — absent for a state with no `emits`, never a default/null entry`"
traces_to = "[[compile]]"

[[constraints]]
id = "properties_to_proptest"
kind = "invariant"
expr = "`each Property row compiles to one proptest! block: generator becomes the block's input strategy, predicate becomes its assertion body — verbatim as a **rust:** fragment when the row opts in ([[compile.predicate_fragment_opt_in]]), else the un-translated todo_predicate! placeholder that compiles here and fails only at execution; a law-kind property compiles to one block per case enumerated in its predicate's **name:** case labels (the identity and associativity floor is lint-enforced ahead of compile, specodelic.md Revision 13)`"
traces_to = "[[compile]]"

[[constraints]]
id = "predicate_fragment_opt_in"
kind = "invariant"
expr = "`a Property's predicate cell may opt into executable translation with exactly one **rust:** marker and a non-empty fragment after it — the fragment is a Rust boolean expression emitted verbatim as the block's assertion body, the cell text after the marker — to the cell's end or the code span's closing backtick — is the fragment, binding the block's generated values (v0…, one per generator named in the generator cell, each a String); the marker opts in only in fragment position — starting the cell or immediately opening the fragment's code span, a backtick directly before it — an occurrence anywhere else (mid-span, as in the defining rows of this very table, or in prose between spans) is a mention of the mechanism and never extracts (specodelic-sd1); a cell with no marker compiles exactly as before (the placeholder) — pure widening, nothing valid before this Revision is invalidated`"
traces_to = "[[compile]]"

[[constraints]]
id = "invariant_fragment_opt_in"
kind = "invariant"
expr = "`a Constraint's expr cell may carry the same **rust:** fragment when the row's kind is invariant, under the same fragment-position rule as [[compile.predicate_fragment_opt_in]] — the fragment becomes an executable invariant model_check's native backend executes (model_check.md Revision 15); a fragment on a Constraint of any other kind (effect, advisory, a pack fiber kind) is a labeled extraction failure, never a silently ignored marker`"
traces_to = "[[compile]]"

[[constraints]]
id = "fragment_law_rejected"
kind = "invariant"
expr = "`a law-kind Property row's predicate cell must not carry a **rust:** fragment — each required case needs its own assertion body and one fragment cannot honestly serve several named cases; violation is a labeled extraction failure`"
traces_to = "[[compile]]"

[[constraints]]
id = "fragment_guard_rejected"
kind = "invariant"
expr = "`a Transition's guard cell must not carry a **rust:** fragment in this Revision — the program-counter model has no data binding a guard could constrain, so executable guards have no defined semantics; violation is a labeled extraction failure, never a silently ignored marker (decision of record: deferred to a future Revision alongside a data-carrying state space)`"
traces_to = "[[compile]]"

[[constraints]]
id = "fragment_language_closed"
kind = "invariant"
expr = "`the executable-fragment tag set is closed: a cell in fragment position may carry exactly one **rust:**, **py:**, or **ts:** marker per the grammar below — the same closed-set discipline as [[specodelic.property_kind_closed]] and [[specodelic.constraint_kind_closed]]; the fragment-position rule and the non-empty-fragment requirement carry over verbatim per tag, and **rust:** remains the fully specified case with byte-identical semantics (widening [[compile.predicate_fragment_opt_in]]/[[compile.invariant_fragment_opt_in]]'s grammar; [[specodelic-lf3]] Revision 16)`"
traces_to = "[[compile]]"

[[constraints]]
id = "unknown_tag_rejected"
kind = "invariant"
expr = "`a marker in fragment position whose tag is not in the closed set — **go:**, **java:**, any non-member — is a labeled extraction failure naming the unknown tag and the closed set, never a silently ignored marker (sd1's no-silent-markers discipline carried into the widened grammar; [[specodelic-lf3]] Revision 16)`"
traces_to = "[[compile]]"

[[constraints]]
id = "rust_back_compat"
kind = "invariant"
expr = "`every cell that extracted a **rust:** fragment under Revision 15's grammar extracts a byte-identical fragment under the widened grammar, and a cell without any marker compiles exactly as before — pure widening, nothing valid at Revision 15 is invalidated ([[specodelic-lf3]] Revision 16)`"
traces_to = "[[compile]]"

[[constraints]]
id = "no_emitter_labeled_failure"
kind = "invariant"
expr = "`a **py:** or **ts:** fragment in fragment position fails compile labeled, with a remediation hint naming the per-language emitter follow-up — executable emission for those languages is deferred of record ([[specodelic-lf3]] Revision 16, follow-ups add-py-fragment-emission/add-ts-fragment-emission); an accepted tag without an emitter would silently fall through to Rust, the vacuous outcome the closed set exists to prevent`"
traces_to = "[[compile]]"

[[constraints]]
id = "mention_not_extraction"
kind = "invariant"
expr = "`a **rust:**/**py:**/**ts:** occurrence anywhere other than fragment position — mid-span, as in the defining rows of this very table, or in prose between spans — is a mention of the mechanism and never extracts (sd1's rule carried into the widened grammar; [[specodelic-lf3]] Revision 16)`"
traces_to = "[[compile]]"

[[constraints]]
id = "fragment_hygiene"
kind = "invariant"
expr = "`a fragment's text must not contain unsafe, extern, include!, include_str!, include_bytes!, std::fs, std::process, std::net, std::env, asm!, or Command — defense-in-depth against a fragment escaping its artifact's role (fragments run on the invoking user's machine with the invoking user's privileges, exactly like every other compiled artifact; the Rust compiler is not a sandbox); violation is a labeled extraction failure naming the token`"
traces_to = "[[compile]]"

[[constraints]]
id = "compile_is_total"
kind = "invariant"
expr = "`∀ file that has passed lint and coverage: Compile either produces all three artifacts or reports, for exactly one of them, which stage failed and why — it never returns a silent partial result`"
traces_to = "[[compile]]"

[[constraints]]
id = "compile_preserves_ids"
kind = "invariant"
expr = "`every id present in the source file appears, unchanged, in at least one compiled artifact — no id is silently dropped in translation`"
traces_to = "[[compile]]"

[[constraints]]
id = "no_semantic_drift"
kind = "invariant"
expr = "`re-parsing a compiled artifact and re-emitting it yields output identical to the original compile — Compile is idempotent under its own round trip`"
traces_to = "[[compile]]"

[[constraints]]
id = "extraction_failure"
kind = "effect"
expr = "`compile.extraction_failure(row_id, reason) — the extraction stage failed on row row_id because reason`"
traces_to = "[[compile]]"

[[constraints]]
id = "emission_failure"
kind = "effect"
expr = "`compile.emission_failure(detail) — the emission stage failed because detail`"
traces_to = "[[compile]]"
