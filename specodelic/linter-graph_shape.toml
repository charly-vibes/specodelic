source = "linter.graph_shape"

[[constraints]]
id = "acyclic"
kind = "invariant"
expr = "`the directed graph formed by constraint-traces_to ∪ property-derives_from ∪ guard-as-edge has no cycle` — the edge set is closed and property-sourced: derives_from edges are taken from Property rows only, because the Reference Typing table's Appears-on column is normative (a Constraint-row derives_from is out-of-format — `ref_kind_compatible`'s beat, never an edge here; decided of record 2026-10-01, `specodelic-huf`)"
traces_to = "[[linter.graph_shape]]"

[[constraints]]
id = "single_root_reachable"
kind = "invariant"
expr = "`∀ constraint/property/state/transition row: reachable(row, the file's own intent row through own-file primary linkage)` — same claim as [[specodelic.single_root_reachable]] at checker altitude"
traces_to = "[[linter.graph_shape]]"

[[constraints]]
id = "no_self_ref"
kind = "invariant"
expr = "`∀ row: row.traces_to != row.id and row.derives_from != row.id`"
traces_to = "[[linter.graph_shape]]"

[[constraints]]
id = "supersedes_dag"
kind = "invariant"
expr = "`the directed graph formed by supersedes edges alone (Constraint→Constraint, Property→Property) has no cycle`"
traces_to = "[[linter.graph_shape]]"

[[constraints]]
id = "check_failure"
kind = "effect"
expr = "`linter.graph_shape.check_failure(detail)`"
traces_to = "[[linter.graph_shape]]"
