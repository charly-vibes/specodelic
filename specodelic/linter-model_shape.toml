source = "linter.model_shape"

[[constraints]]
id = "guard_present"
kind = "invariant"
expr = "`∀ transition row: guard field is non-empty`"
traces_to = ""

[[constraints]]
id = "model_sections_paired"
kind = "invariant"
expr = "`if [[model.state]] exists then [[model.transition]] exists, and vice versa`"
traces_to = ""

[[constraints]]
id = "every_state_used"
kind = "invariant"
expr = "`∀ state: state appears as from or to in ≥ 1 transition`"
traces_to = ""

[[constraints]]
id = "every_transition_valid"
kind = "invariant"
expr = "`∀ transition: from ∈ states and to ∈ states`"
traces_to = ""

[[constraints]]
id = "no_bool_state_field"
kind = "invariant"
expr = "`no state or transition row has a column of boolean type`"
traces_to = ""

[[constraints]]
id = "pairing_failure"
kind = "effect"
expr = "`linter.model_shape.pairing_failure(detail) — the label names its owning file per error_expr_shape`"
traces_to = ""

[[constraints]]
id = "field_check_failure"
kind = "effect"
expr = "`linter.model_shape.field_check_failure(detail) — the label names its owning file per error_expr_shape`"
traces_to = ""
