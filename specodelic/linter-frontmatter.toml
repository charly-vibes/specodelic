source = "linter.frontmatter"

[[constraints]]
id = "has_id"
kind = "invariant"
expr = "`frontmatter.id != null and matches(id, /^[a-z][a-z0-9_.]*$/)`"
traces_to = "[[specodelic.frontmatter_valid]]"

[[constraints]]
id = "has_kind"
kind = "invariant"
expr = '`frontmatter.kind == "intent"`'
traces_to = "[[specodelic.frontmatter_valid]]"

[[constraints]]
id = "has_statement"
kind = "invariant"
expr = "`frontmatter.statement != null and len(statement) > 0`"
traces_to = "[[specodelic.frontmatter_valid]]"

[[constraints]]
id = "id_matches_file"
kind = "invariant"
expr = "`frontmatter.id == expected_id_from_filename(path)`"
traces_to = "[[specodelic.frontmatter_valid]]"

[[constraints]]
id = "check_failure"
kind = "effect"
expr = "`linter.frontmatter.check_failure(detail) — the label names its owning file per error_expr_shape`"
traces_to = "[[linter.frontmatter]]"
