# Pinned ecosystem tool versions for this repo's CI and dev setup.
# Standardization §4: installs are pinned, never `latest` — a broken release
# of any tool must not break CI of the whole fleet.
# Update deliberately; the conformance test (dulce-de-leche
# tests/standard_conformance.rs) requires this file to exist.
#
# §4 matrix row (specodelic): pretender ✅ · wai ✅ · bd ✅ · openspec ✅ · ddl ✅
# openspec deliberately pinned to 1.14.2 — the spk gate's `openspec validate`
# runs the 1.x CLI (managed blocks are not part of specodelic's contract;
# the fleet 0.19.0 pin predates this repo's gate migration).

[tools]
wai = "2026.9.28"          # crates.io: wai-cli
pretender = "0.6.0"        # crates.io
dulce-de-leche = "0.7.0"   # crates.io (bin: ddl)
openspec = "1.14.2"        # npm: @fission-ai/openspec — the gate's validate CLI (ci.yml pins this)
bd = "1.3.0"               # beads — pinned GitHub release download (no versioned homebrew-core formula)
