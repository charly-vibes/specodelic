# Publish workflow - runs the full CI gate, then publishes to crates.io
#
# Triggered by pushing a version tag (e.g., `git tag v0.1.0 && git push --tags`).
# The tag push IS the release authorization: no tag, no publish.
#
# Required secrets:
#   CARGO_REGISTRY_TOKEN - crates.io API token for publishing the crate
#
# Notes:
# - `--locked` guarantees the committed Cargo.lock is what ships.
# - Binary-only installers (GitHub Release archives, homebrew/scoop tap
#   updates) are a deliberate follow-up — see the pretender/espectacular
#   release.yml pattern when specodelic joins the taps.

name: Publish

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: CI checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Run CI pipeline
        run: just ci

      - name: Dogfood - lint the spec corpus
        run: just lint-specs

      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "specodelic") | .version')
          if [ "${TAG}" != "${CARGO_VERSION}" ]; then
            echo "tag v${TAG} != Cargo.toml version ${CARGO_VERSION}"
            exit 1
          fi

      - name: Package dry-run
        run: cargo package --locked --allow-dirty

  publish:
    name: Publish to crates.io
    needs: [check]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Publish crate
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
