name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'book.toml'
      - 'theme/**'
      - 'Cargo.toml'
      - 'llms.txt'
      - 'llm.txt'
      - 'justfile'
      - '.github/workflows/docs.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest

      # mermaid blocks in docs/src/graph-views.md (generated graph views,
      # add-graph-views) need the preprocessor — without it the book ships
      # unrendered ```mermaid code fences (seen on graph-views.html). The
      # bundle itself is untracked (.gitignore) — `just docs-mermaid` fetches
      # it, pinned; same recipe as local `just docs-build` (no drift).
      - name: Install mdbook-mermaid
        run: cargo install mdbook-mermaid --locked

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Copy spec trees into the book source
        run: |
          cp -r specs docs/src/specs
          cp -r openspec/specs docs/src/openspec

      - name: Generate release-status page
        # scripts/stamp_llms.py — shared with `just docs-build` so the CI
        # and local paths cannot drift (specodelic-2m7). Version comes from
        # Cargo.toml, never hand-typed text — §6 (DDL-j0u).
        run: python3 scripts/stamp_llms.py page

      - name: Generate graph views
        # add-graph-views 3.3: docs/src/graph-views.md {{#include}}s the
        # generated views — they must exist before mdbook build. Same
        # recipe as local `just docs-graphs` (shared path, no drift).
        run: just docs-graphs

      - name: Fetch vendored mermaid bundle
        # book.toml additional-js points at vendor/mermaid.min.js (untracked,
        # see .gitignore). Same recipe as local docs-build — lockstep.
        run: just docs-mermaid

      - name: Build docs
        run: mdbook build

      - name: Assert no unresolved view includes
        # mdbook only WARNS on a missing {{#include}} and emits the raw
        # directive — a green build can still ship a page with unrendered
        # views. Same assertion as the `docs-build` recipe (keep in
        # lockstep).
        run: |
          if grep -rq '{{#include' book/; then
            echo "unresolved {{#include}} leaked into the built book:" >&2
            grep -rl '{{#include' book/ >&2
            exit 1
          fi

      - name: Stamp llms.txt into site root
        # scripts/stamp_llms.py — crate version + build ref + Release
        # Status link on the DEPLOYED copy; repo-source llms.txt is never
        # touched (specodelic-2m7).
        run: python3 scripts/stamp_llms.py llms

      - name: Refresh repo-root narrative
        # specodelic-lf4b.11: keep the CI path in lockstep with `just
        # docs-build` — the root phase derives repo-root llm.txt from
        # llms.txt + SUMMARY.md (ephemeral in CI; the local run surfaces
        # drift in git status).
        run: python3 scripts/stamp_llms.py root


      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    # Tags trigger this workflow too (push filter is a branch/tag OR),
    # but the github-pages environment only accepts main — a tag-ref
    # deployment dies job-level in seconds (v0.5.1 run 37313667167).
    # The site is always deployed from main; a tag build is redundant.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
