# CI workflow - runs the same commands as local development
#
# Uses `just ci` to ensure parity between local and CI environments.
# If CI fails, run `just ci` locally to reproduce the issue.
#
# Hardening (specodelic-oet): the ubuntu leg runs the full pipeline;
# macOS/Windows legs run clippy + tests (cross-platform CLI contract);
# a pinned MSRV job guards the declared rust-version; cargo-deny gates
# advisories + licenses.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: Full pipeline
    runs-on: ubuntu-latest
    # doc-examples may replay a verify scenario twice (cold scratch compile
    # can eat the 600s wall clock on the first run; the gate retries warm —
    # specodelic doc-gate retry). Two 600s verify budgets + the test suite
    # needs > 15m; 40m leaves headroom without masking true hangs.
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install openspec (pinned 1.x validator — the gate's `openspec`)
        run: npm install -g @fission-ai/openspec@1.14.2

      - name: Install ecosystem tools (§4 dogfood matrix, pinned)
        run: |
          cargo install --locked pretender@0.6.0 wai-cli@2026.9.28 dulce-de-leche@0.7.0 espectacular@0.9.2
      # The executed espectacular gate runs the pytest-bound contracts
      # (add-language-neutral-property-binding tasks 1.2-1.4) — the runner
      # needs pytest + hypothesis, pinned (ci_wiring drift guard pins this).
      - name: Install pytest runner deps (pinned)
        run: pip install --break-system-packages pytest==9.0.3 hypothesis==6.168.5
      - name: Install bd (beads, pinned §4)
        run: |
          tmp=$(mktemp -d)
          curl -fsSL https://github.com/gastownhall/beads/releases/download/v1.3.0/beads_1.3.0_linux_amd64.tar.gz -o "$tmp/bd.tgz"
          # extract only the binary — the tarball also ships README/LICENSE/CHANGELOG
          # which must not clobber the repo checkout
          tar -xzf "$tmp/bd.tgz" -C "$tmp" bd
          sudo mv "$tmp/bd" /usr/local/bin/bd
      # §4 dogfood: installed tools must run, not just install
      - name: Smoke dogfooded tools
        env:
          DO_NOT_TRACK: "1"
        run: |
          bd --version >/dev/null
          ddl status >/dev/null
          wai status >/dev/null
          scripts/guards/pretender-pin.sh .
          pretender check >/dev/null
      # DDL-43g: smoke our own live Pages URL — a 404'd book must fail this
      # repo's CI immediately, not wait for the next hub conformance run.
      - name: Smoke live Pages URL
        run: curl -fsS --max-time 10 --retry 2 https://charly-vibes.github.io/specodelic/ >/dev/null
      - name: Run CI pipeline
        run: just ci

  cross:
    name: Clippy & tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Tests
        run: cargo test

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust (pinned MSRV)
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Tests on MSRV
        run: cargo test

  deny:
    name: cargo-deny (advisories + licenses)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses
