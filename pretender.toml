# pretender.toml — structural-quality hard gate (AGENTS.md sibling-tool
# constraints honored: pretender does NOT claim core.hooksPath and never
# writes .git/hooks; the gate runs via lefthook.yml pre-commit (the beads
# shim chain) and `just ci` / `just pretender-check`).
#


# Grandfathered hotspots (known offenders AT the ratchet ceiling — refactor
# targets, tracked in beads; do NOT raise thresholds to add new headroom):
#   src/verify.rs::model_gate_clean_and_not_clean_outcomes
#   src/lint.rs::lint_model_family
#   src/merge.rs::run
#   src/main.rs::parse_batch

[pretender]
mode = "gate"
languages = ["auto"]
exclude = [
  "target/**",
  "./target/**",
  "book/**",
  "./book/**",
  "docs/**",
  "./docs/**",
  "vendor/**",
  "node_modules/**",
  "**/*_generated.*",
]

[thresholds]
# Ratchet positions after the specodelic-g17 refactor pass (2026-10-05):
# measured maxima with working excludes — app worst fn cyclomatic 20
# (acset/doc parse_typing_table), cognitive 48 (lint_coverage), abc 89
# (lint_failure_shape_family), function_lines 209 (acset/schema canonical),
# nesting 6 (lint_checklists); largest file src/model_check.rs 2202.
cyclomatic_max = 20
cognitive_max = 48
abc_max = 90
function_lines_max = 209
nesting_max = 6
params_max = 8
file_lines_max = 2300
exported_cyclomatic_max = 20
exported_params_max = 8
exported_lines_max = 320

# Test role (tests/**): ratchet at current test-suite maxima (2026-10-05:
# worst test fn cyclomatic 19, cognitive 33, abc 72, function_lines 235
# (failure_terminals_emit_labeled_errors, tests/cli/lint.rs); largest test
# file tests/cli/parse_misc.rs 1452).
[thresholds.test]
cyclomatic_max = 20
cognitive_max = 33
function_lines_max = 235
nesting_max = 4
params_max = 8
min_assertions = 0
file_lines_max = 1500

# Script role (scripts/**): ratchet at current script maxima (2026-10-05:
# worst script fn cyclomatic 15, cognitive 31, function_lines 59).
[thresholds.script]
cyclomatic_max = 15
cognitive_max = 31
function_lines_max = 59
nesting_max = 4
params_max = 3
min_assertions = 0

# Library-exported role: ratchet (2026-10-05: worst exported fn at the
# app maxima; largest lib file src/model_check.rs 2202).
[thresholds.library]
exported_cyclomatic_max = 20
exported_params_max = 8
exported_lines_max = 320
file_lines_max = 2300

[roles.test]
paths = ["tests/**", "tests/**/**", "**/tests/**"]

[roles.script]
paths = ["scripts/**", "examples/**"]