# lefthook.yml — sibling-tool constraint guards for specodelic.
#
# The beads shims in .beads/hooks (core.hooksPath) already chain to lefthook,
# so this config is the sanctioned extension point — no tool may claim
# core.hooksPath or write .git/hooks directly (AGENTS.md hard blockers).
# The same guard runs in CI via `just ci` (guard-siblings recipe).

pre-commit:
  commands:
# ah:managed:start
    ah-check:
      run: ah check
# ah:managed:end
    # <!-- SPK:START -->
    specodelic-gates:
      run: spk lint openspec
    # <!-- SPK:END -->
    # <!-- PRETENDER:START --> gate mode; pretender.toml ratchets only DOWN
    pretender-gate:
      run: pretender check --staged --mode gate
    # <!-- PRETENDER:END -->
    sibling-blockers:
      run: scripts/guards/sibling-blockers.sh .
    # gate-drill interlock (specodelic-do8, dz4 remediation-b): refuse
    # commit/push while a live gate-drill advisory lock is held — a
    # concurrent session must not sweep a drill's seeded-violation state
    # into a commit. Stale locks warn only. See
    # openspec/decisions/2026-10-05-precommit-sweep-policy.md
    gate-drill-lock:
      run: scripts/guards/gate-drill-lock.sh check .

pre-push:
  commands:
    sibling-blockers:
      run: scripts/guards/sibling-blockers.sh .
    gate-drill-lock:
      run: scripts/guards/gate-drill-lock.sh check .
