[package]
name = "specodelic"
version = "0.3.1"
edition = "2024"
rust-version = "1.88"
default-run = "specodelic"
description = "Specodelic — a markdown specification format (Intent / Constraints / Model / Properties) and the `spk` CLI that lints, compiles, verifies, and refactors it"
license = "Apache-2.0"
repository = "https://github.com/charly-vibes/specodelic"
readme = "README.md"
keywords = ["specification", "linter", "verification", "cli", "tla-plus"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "specodelic"
path = "src/main.rs"

# Suite alias convention (see dont: `dt`): short form for interactive use.
[[bin]]
name = "spk"
path = "src/main.rs"

[lib]
name = "specodelic"

[dependencies]
genesis-vibes = { version = "0.11", features = ["update-check"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
proptest = "1"
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
regex = "1"
stateright = "0.31.0"
sha2 = "0.11.0"
serde_yaml_ng = "0.10.0"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
filetime = "0.2"
