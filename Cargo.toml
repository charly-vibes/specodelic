[package]
name = "specodelic"
version = "0.1.0"
edition = "2024"
default-run = "specodelic"
description = "Specodelic — a markdown specification format (Intent / Constraints / Model / Properties) and the `spk` CLI that lints, compiles, verifies, and refactors it"
license = "Apache-2.0"
repository = "https://github.com/charly-vibes/specodelic"
readme = "README.md"
keywords = ["specification", "linter", "verification", "cli", "tla-plus"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "specodelic"
path = "src/main.rs"

# Suite alias convention (see dont: `dt`): short form for interactive use.
[[bin]]
name = "spk"
path = "src/main.rs"

[lib]
name = "specodelic"

[dependencies]
genesis-vibes = "0.7"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
proptest = "1"
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
regex = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"